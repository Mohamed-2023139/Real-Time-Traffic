version: "3.9"

services:

  # =========================
  # HIVE METASTORE DATABASE
  # =========================
  postgres-metastore:
    image: postgres:13
    container_name: hive-metastore-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5435:5432"

    volumes:
      - metastore_db:/var/lib/postgresql/data

  # =========================
  # HIVE METASTORE
  # =========================
  hive-metastore:
    build:
      context: ./hive-conf
      dockerfile: Dockerfile

    image: real-time-traffic-hive-metastore:3.1.3
    container_name: hive-metastore

    depends_on:
      - postgres-metastore

    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      IS_RESUME: "true"

    ports:
      - "9083:9083"

    volumes:
      - ./hive-conf/hive-site.xml:/opt/hive/conf/hive-site.xml
      - ./warehouse:/warehouse

  # =========================
  # SPARK MASTER
  # =========================
  spark-master:
    build:
      context: ./spark
      dockerfile: Dockerfile

    image: real-time-traffic-spark:3.5.1
    container_name: spark-master
    hostname: spark-master

    command: >
      bash -c "
      /opt/spark/sbin/start-master.sh &&
      tail -f /opt/spark/logs/*
      "

    ports:
      - "7077:7077"
      - "8080:8080"

    volumes:
      - ./warehouse:/warehouse
      - ./apps:/opt/spark-apps

  # =========================
  # SPARK WORKER + THRIFT SERVER
  # =========================
  spark-worker:
    build:
      context: ./spark
      dockerfile: Dockerfile

    image: real-time-traffic-spark:3.5.1
    container_name: spark-worker
    hostname: spark-worker

    depends_on:
      - spark-master
      - hive-metastore

    ports:
      - "8081:8081"
      - "4040:4040"
      - "10000:10000"

    volumes:
      - ./warehouse:/warehouse
      - ./apps:/opt/spark-apps

    command: >
      bash -c "

      /opt/spark/sbin/start-worker.sh \
      spark://spark-master:7077 \
      --cores 2 \
      --memory 2g;

      echo 'Waiting for Hive Metastore...';

      until python3 -c \"import socket; s=socket.socket(); exit(s.connect_ex(('hive-metastore',9083)))\";
      do
        sleep 2;
      done;

      echo 'Hive Metastore is ready';

      /opt/spark/sbin/start-thriftserver.sh \
        --master spark://spark-master:7077 \
        --conf spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension \
        --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog \
        --conf spark.sql.catalogImplementation=hive \
        --conf spark.hadoop.hive.metastore.uris=thrift://hive-metastore:9083 \
        --conf spark.sql.warehouse.dir=/warehouse;

      tail -f /opt/spark/logs/*
      "

  # =========================
  # KAFKA (KRaft)
  # =========================
  kafka:
    image: apache/kafka:latest
    container_name: kafka

    ports:
      - "9092:9092"
      - "29092:29092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

  # =========================
  # KAFKA UI
  # =========================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui

    depends_on:
      - kafka

    ports:
      - "8090:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: ${KAFKA_CLUSTER_NAME}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

volumes:
  metastore_db: